<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備管理系統 - 登入</title>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; box-sizing: border-box; }
        .login-card { background: white; padding: 30px 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 380px; }
        h2 { text-align: center; color: #333; margin-top: 0; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        input:focus { border-color: #0056b3; outline: none; }
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        button:disabled { background-color: #99bce0; cursor: not-allowed; }
        #msg { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>設備管理系統登入</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="user_id">帳號（教職員編號 / 學號）</label>
                <input type="text" id="user_id" placeholder="請輸入帳號" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" placeholder="請輸入密碼" required autocomplete="current-password">
            </div>
            <button type="submit" id="login-btn">登入系統</button>
        </form>
        <div id="msg"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby6LScaklLoa5lIhOucKWLZfY5S_6EPL7SH4wnwQ1HFssyZigvIvkcdBzaJ8UUoH2k-/exec";

        // 若已經登入過，直接前往 scan.html
        if (localStorage.getItem("eq_user")) {
            window.location.href = "scan.html";
        }

        document.getElementById("login-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const userId = document.getElementById("user_id").value.trim();
            const password = document.getElementById("password").value.trim();
            const btn = document.getElementById("login-btn");
            const msg = document.getElementById("msg");

            btn.disabled = true;
            btn.innerText = "驗證中...";
            msg.style.color = "#0056b3";
            msg.innerText = "正在連線驗證帳號...";

            const url = `${API_URL}?action=login&user_id=${encodeURIComponent(userId)}&password=${encodeURIComponent(password)}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        localStorage.setItem("eq_user", JSON.stringify(data.user));
                        msg.style.color = "green";
                        msg.innerText = `歡迎，${data.user.name}！正在進入掃描器...`;
                        setTimeout(() => {
                            window.location.href = "scan.html";
                        }, 600);
                    } else {
                        msg.style.color = "red";
                        msg.innerText = data.message;
                        btn.disabled = false;
                        btn.innerText = "登入系統";
                    }
                })
                .catch(err => {
                    msg.style.color = "red";
                    msg.innerText = "連線失敗，請檢查網路或 GAS 部署狀態。";
                    btn.disabled = false;
                    btn.innerText = "登入系統";
                });
        });
    </script>
</body>
</html>
