<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備借用清單</title>
    <style>
        body { font-family: sans-serif; background-color: #f8f9fa; padding: 15px; margin: 0; }
        .container { max-width: 700px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; }
        .back-btn { padding: 10px 16px; background-color: #0056b3; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .refresh-btn { padding: 10px 14px; background-color: #6c757d; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
        h2 { margin: 0 0 12px 0; color: #333; font-size: 20px; }
        
        /* 老師專用三格獨立統計區塊 */
        .summary-grid { display: none; gap: 10px; margin-bottom: 15px; }
        .stat-card { flex: 1; background: white; padding: 14px 8px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); text-align: center; }
        .stat-label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .stat-num { display: block; font-size: 28px; font-weight: bold; line-height: 1.1; }
        
        .stat-available { color: #198754; }
        .stat-borrowed { color: #dc3545; }
        .stat-total { color: #0056b3; }

        .filter-group { display: none; gap: 8px; margin-bottom: 15px; }
        .filter-btn { padding: 8px 14px; border: 1px solid #ccc; background: white; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .filter-btn.active { background-color: #343a40; color: white; border-color: #343a40; }
        .card { background: white; padding: 14px 16px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 10px; border-left: 5px solid #28a745; }
        .card.borrowed { border-left-color: #dc3545; }
        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .eq-title { font-weight: bold; font-size: 16px; color: #222; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-ok { background-color: #d4edda; color: #155724; }
        .badge-out { background-color: #f8d7da; color: #721c24; }
        .card-detail { font-size: 14px; color: #555; line-height: 1.5; }
        .empty-msg { text-align: center; padding: 40px 20px; background: white; border-radius: 8px; color: #666; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <button class="back-btn" onclick="window.location.href='scan.html'">返回掃描器</button>
            <button class="refresh-btn" onclick="loadList()">重新整理</button>
        </div>

        <h2 id="page-title">設備清單載入中...</h2>

        <!-- 老師專用的數量統計區塊（可借用：綠 / 借出中：紅 / 所有設備：藍） -->
        <div id="teacher-summary" class="summary-grid">
            <div class="stat-card stat-available">
                <span class="stat-label">可借用</span>
                <span class="stat-num" id="count-available">0</span>
            </div>
            <div class="stat-card stat-borrowed">
                <span class="stat-label">借出中</span>
                <span class="stat-num" id="count-borrowed">0</span>
            </div>
            <div class="stat-card stat-total">
                <span class="stat-label">所有設備</span>
                <span class="stat-num" id="count-total">0</span>
            </div>
        </div>

        <!-- 老師專用的狀態篩選列 -->
        <div id="teacher-filters" class="filter-group">
            <button class="filter-btn active" onclick="filterItems('all', this)">全部設備</button>
            <button class="filter-btn" onclick="filterItems('借出中', this)">借出中</button>
            <button class="filter-btn" onclick="filterItems('可借用', this)">可借用</button>
        </div>

        <div id="list-container"></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwld9ZFCvrhPCx3sk1Jfl0h_j0g11USfSoXU0FH5oCHgn9ozAlKvbkj3UCc4ZDL-Zuj/exec";
        const IDLE_LIMIT_MS = 60000; // 閒置上限 60 秒

        const userStr = localStorage.getItem("eq_user");
        if (!userStr) {
            window.location.href = "index.html";
        }
        const currentUser = JSON.parse(userStr);
        let allItems = [];

        function logout(isTimeout) {
            localStorage.removeItem("eq_user");
            localStorage.removeItem("eq_last_active");
            window.location.href = isTimeout ? "index.html?timeout=1" : "index.html";
        }

        // --- 閒置 60 秒自動登出機制 ---
        function resetIdleTimer() {
            localStorage.setItem("eq_last_active", String(Date.now()));
        }

        const initLastActive = parseInt(localStorage.getItem("eq_last_active") || "0", 10);
        if (initLastActive && (Date.now() - initLastActive > IDLE_LIMIT_MS)) {
            logout(true);
        } else {
            resetIdleTimer();
        }

        ["mousemove", "mousedown", "keydown", "touchstart", "scroll", "click"].forEach(evt => {
            document.addEventListener(evt, resetIdleTimer, { passive: true });
        });

        setInterval(() => {
            const last = parseInt(localStorage.getItem("eq_last_active") || "0", 10);
            if (Date.now() - last > IDLE_LIMIT_MS) {
                logout(true);
            }
        }, 1000);

        // --- 權限介面初始化 ---
        if (currentUser.role === "teacher") {
            document.getElementById("page-title").innerText = "所有設備狀態總覽（老師權限）";
            document.getElementById("teacher-summary").style.display = "flex";
            document.getElementById("teacher-filters").style.display = "flex";
        } else {
            document.getElementById("page-title").innerText = `${currentUser.name} 目前借用的設備`;
        }

        function updateTeacherSummary(items) {
            if (currentUser.role !== "teacher") return;
            const availableCount = items.filter(item => item.status === "可借用").length;
            const borrowedCount = items.filter(item => item.status === "借出中").length;
            const totalCount = items.length;

            document.getElementById("count-available").innerText = availableCount;
            document.getElementById("count-borrowed").innerText = borrowedCount;
            document.getElementById("count-total").innerText = totalCount;
        }

        function loadList() {
            resetIdleTimer();
            const container = document.getElementById("list-container");
            container.innerHTML = `<div class="empty-msg">資料讀取中，請稍候...</div>`;

            const url = `${API_URL}?action=list&user_id=${encodeURIComponent(currentUser.user_id)}&role=${encodeURIComponent(currentUser.role)}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    resetIdleTimer();
                    if (data.status === "success") {
                        allItems = data.items;
                        updateTeacherSummary(allItems);
                        renderItems(allItems);
                    } else {
                        container.innerHTML = `<div class="empty-msg" style="color:red;">讀取失敗：${data.message}</div>`;
                    }
                })
                .catch(err => {
                    container.innerHTML = `<div class="empty-msg" style="color:red;">連線錯誤，請稍後再試。</div>`;
                });
        }

        function filterItems(statusType, btnElement) {
            resetIdleTimer();
            document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
            btnElement.classList.add("active");

            if (statusType === "all") {
                renderItems(allItems);
            } else {
                const filtered = allItems.filter(item => item.status === statusType);
                renderItems(filtered);
            }
        }

        function renderItems(items) {
            const container = document.getElementById("list-container");
            if (!items || items.length === 0) {
                const emptyText = currentUser.role === "teacher" ? "目前沒有符合條件的設備。" : "您目前沒有借用任何設備。";
                container.innerHTML = `<div class="empty-msg">${emptyText}</div>`;
                return;
            }

            container.innerHTML = items.map(item => {
                const isBorrowed = item.status === "借出中";
                const cardClass = isBorrowed ? "card borrowed" : "card";
                const badgeClass = isBorrowed ? "badge badge-out" : "badge badge-ok";

                let borrowInfo = "";
                if (isBorrowed) {
                    borrowInfo = `
                        <div><strong>借用人：</strong>${item.borrower_name} (${item.borrower_id})</div>
                        <div><strong>借出時間：</strong>${item.borrow_time}</div>
                    `;
                }

                return `
                    <div class="${cardClass}">
                        <div class="card-top">
                            <span class="eq-title">[${item.equipment_id}] ${item.brand} ${item.name}</span>
                            <span class="${badgeClass}">${item.status}</span>
                        </div>
                        <div class="card-detail">
                            ${borrowInfo}
                        </div>
                    </div>
                `;
            }).join("");
        }

        loadList();
    </script>
</body>
</html>
